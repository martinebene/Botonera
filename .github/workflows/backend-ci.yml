name: Backend CI

on:
  pull_request:
    branches:
      - v2
  push:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-backend.txt

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements-backend.txt

      - name: Verificar dependencias
        run: python -m pip check

      - name: Compilar backend
        run: python -m compileall app devices_services

      - name: Ejecutar pruebas y cobertura
        run: >-
          python -m pytest -q --strict-markers
          --cov=app
          --cov-report=term-missing
          --cov-report=xml

      - name: Publicar cobertura XML
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: coverage.xml
          retention-days: 7
